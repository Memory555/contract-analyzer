  <text x="84" y="50" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">飞渡</text>
  <text x="84" y="73" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#9fb1c8">合同智能平台</text>

  <text x="28" y="128" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#7890ad">主导航</text>
  <rect x="16" y="152" width="224" height="48" rx="8" fill="#223a56"/>
  <rect x="16" y="152" width="4" height="48" rx="2" fill="#4aa3ff"/>
  <text x="44" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">合同分析</text>
  <text x="44" y="234" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#b8c7da">工作台</text>
  <text x="44" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#b8c7da">问题审查</text>
  <text x="44" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#b8c7da">导出中心</text>
  <text x="44" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#b8c7da">设置</text>

  <rect x="20" y="920" width="216" height="84" rx="8" fill="#172b44"/>
