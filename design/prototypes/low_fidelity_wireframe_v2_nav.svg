  <text x="296" y="66" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#182033">上传合同并生成结构化分析结果</text>
  <rect x="1388" y="24" width="128" height="36" rx="18" fill="#eef6ff"/>
  <text x="1452" y="47" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#275e9f">V1.0 单合同</text>
  <rect x="1536" y="24" width="96" height="36" rx="18" fill="#f5f7fa"/>
  <text x="1584" y="47" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#607086">无登录</text>

  <rect x="296" y="116" width="906" height="244" rx="8" fill="#ffffff" stroke="#d9e1ec" stroke-width="2"/>
  <text x="328" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#182033">上传合同</text>
  <text x="438" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8a96a8">支持 PDF / DOC / DOCX，单文件 ≤ 20MB</text>
  <rect x="328" y="184" width="842" height="124" rx="8" fill="#f8fbff" stroke="#7aa7d9" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="749" y="236" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#275e9f">点击或拖拽上传合同</text>
