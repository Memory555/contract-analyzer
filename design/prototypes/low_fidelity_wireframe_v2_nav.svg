  <rect x="1262" y="232" width="346" height="38" rx="6" fill="#f5f7fa"/>
  <text x="1282" y="257" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475569">合同文件：飞渡采购合同模板.docx</text>
  <rect x="1262" y="282" width="166" height="54" rx="6" fill="#fff7f3" stroke="#f0b099"/>
  <text x="1345" y="315" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#a94725">2 个问题</text>
  <rect x="1442" y="282" width="166" height="54" rx="6" fill="#2f74c0"/>
  <text x="1525" y="315" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">下载 Excel</text>

  <text x="296" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#182033">分析结果</text>
  <text x="404" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8a96a8">优先展示风险，再展示结构化明细</text>

  <rect x="296" y="440" width="1344" height="108" rx="8" fill="#fff7f3" stroke="#f0b099" stroke-width="2"/>
