  <text x="863" y="905" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">响应时效</text>
  <rect x="982" y="878" width="198" height="42" rx="5" fill="#eef3f8"/>
  <text x="1081" y="905" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">违约金</text>
  <rect x="1200" y="878" width="198" height="42" rx="5" fill="#eef3f8"/>
  <text x="1299" y="905" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">升级维护</text>
  <rect x="1418" y="878" width="190" height="42" rx="5" fill="#eef3f8"/>
  <text x="1513" y="905" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">期满安排</text>
  <text x="328" y="956" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#607086">建议正式交互中支持“字段卡片 + 详细表格”切换，兼顾阅读和导出字段一致性。</text>
