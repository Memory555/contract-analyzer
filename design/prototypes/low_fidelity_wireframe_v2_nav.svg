<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050">
  <rect width="1680" height="1050" fill="#f4f7fb"/>

  <rect x="0" y="0" width="256" height="1050" fill="#102033"/>
