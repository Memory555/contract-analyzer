  <text x="384" y="521" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">条款矛盾</text>
  <text x="462" y="521" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5f392e">5.4 条质保期 3 年，与 7.1 条质保期 1 年不一致</text>
  <rect x="956" y="500" width="112" height="30" rx="15" fill="#f3a63b"/>
  <text x="1012" y="521" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">定义模糊</text>
  <text x="1090" y="521" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#5f392e">“合理期限内”建议量化</text>

  <rect x="296" y="578" width="1344" height="204" rx="8" fill="#ffffff" stroke="#d9e1ec" stroke-width="2"/>
  <text x="328" y="618" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#182033">付款计划明细</text>
  <rect x="328" y="640" width="1280" height="42" fill="#eef3f8"/>
  <text x="354" y="667" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">阶段</text>
  <text x="498" y="667" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">比例</text>
  <text x="650" y="667" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">付款描述</text>
  <text x="1070" y="667" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">支付时限</text>
  <text x="1320" y="667" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">备注</text>
  <text x="354" y="718" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475569">第一阶段</text>
  <text x="498" y="718" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475569">30%</text>
  <text x="650" y="718" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475569">合同签订后；收到首付款；提供专票</text>
  <text x="1070" y="718" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475569">60 个工作日</text>
  <text x="1320" y="718" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#475569">背靠背付款</text>
  <line x1="328" y1="744" x2="1608" y2="744" stroke="#edf1f5"/>
  <text x="354" y="766" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8a96a8">后续阶段按行展示，付款描述支持多行换行</text>

  <rect x="296" y="812" width="1344" height="188" rx="8" fill="#ffffff" stroke="#d9e1ec" stroke-width="2"/>
