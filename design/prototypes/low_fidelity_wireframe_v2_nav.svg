  <text x="40" y="982" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#7890ad">建议人工复核关键条款</text>

  <rect x="256" y="0" width="1424" height="84" fill="#ffffff"/>
  <line x1="256" y1="84" x2="1680" y2="84" stroke="#d9e1ec" stroke-width="2"/>
