  <rect width="1440" height="960" fill="#f4f7fb"/>
  <style>.font{font-family:"Microsoft YaHei",Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#172033}.h2{font-size:20px;font-weight:700;fill:#172033}.body{font-size:15px;fill:#475569}.muted{font-size:13px;fill:#7b8798}.panel{fill:#fff;stroke:#d9e1ec;stroke-width:2}.active{fill:#eef6ff;stroke:#7aa7d9;stroke-width:2}.btn{fill:#2563eb}.ok{fill:#16a34a}.warn{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}.chip{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.chipActive{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.auto{fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.5}</style>
  <rect x="0" y="0" width="244" height="960" fill="#102033"/>
