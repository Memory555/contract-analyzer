version: "3.8"

services:
  contract-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # === 数据库（CloudBase PostgreSQL）===
      # 首选：完整连接串（DATABASE_URL 与 PG_* 二选一即可）
      - DATABASE_URL=${DATABASE_URL}
      # 备选：分字段配置（未填时后端自动忽略）
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE:-postgres}
      - PG_SSL=${PG_SSL:-true}
      - PG_SSL_REJECT_UNAUTHORIZED=${PG_SSL_REJECT_UNAUTHORIZED:-false}
      # === 后端服务（合同解析 / LLM 分析）===
      - NEXT_PUBLIC_BACKEND_API_BASE_URL=${NEXT_PUBLIC_BACKEND_API_BASE_URL:-http://localhost:8000}
      - BACKEND_API_BASE_URL=${BACKEND_API_BASE_URL:-http://localhost:8000}
      # === LLM（AI 分析）===
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      # === Node 运行环境 ===
      - NODE_ENV=production
    restart: unless-stopped
